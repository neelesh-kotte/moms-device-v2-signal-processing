name: Counterfactual Stress Lab tests

on:
  push:
    paths:
      - "counterfactual_stress_lab.py"
      - "tests/test_counterfactual_stress_lab.py"
      - ".github/workflows/counterfactual-stress-lab.yml"
  pull_request:
    paths:
      - "counterfactual_stress_lab.py"
      - "tests/test_counterfactual_stress_lab.py"
      - ".github/workflows/counterfactual-stress-lab.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy scipy
      - run: python -m unittest discover -s tests -p "test_counterfactual_stress_lab.py"
