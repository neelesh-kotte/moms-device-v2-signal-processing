name: Validate public evidence package

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  external-package-self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: python -m pip install -r external_validation/requirements.txt
      - name: Compile runner
        run: python -m py_compile external_validation/run_external_validation.py
      - name: Run synthetic self-test
        run: python external_validation/run_external_validation.py --self-test
