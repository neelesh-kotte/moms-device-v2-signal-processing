name: PulseCheck tests

on:
  pull_request:
    paths:
      - "pulsecheck.py"
      - "tests/test_pulsecheck.py"
      - ".github/workflows/pulsecheck-tests.yml"
  push:
    branches:
      - "feature/mom-pulsecheck-active-self-test"
    paths:
      - "pulsecheck.py"
      - "tests/test_pulsecheck.py"
      - ".github/workflows/pulsecheck-tests.yml"

jobs:
  pulsecheck-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Run PulseCheck tests
        run: python -m unittest discover -s tests -p "test_pulsecheck.py" -v
