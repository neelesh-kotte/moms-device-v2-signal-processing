name: MOM Red-Team Bench tests

on:
  push:
    paths:
      - "mom_redteam_bench.py"
      - "tests/test_mom_redteam_bench.py"
      - "requirements.txt"
      - ".github/workflows/mom-redteam-bench.yml"
  pull_request:
    paths:
      - "mom_redteam_bench.py"
      - "tests/test_mom_redteam_bench.py"
      - "requirements.txt"
      - ".github/workflows/mom-redteam-bench.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy scipy scikit-learn
      - run: python -m unittest discover -s tests -p "test_mom_redteam_bench.py"
