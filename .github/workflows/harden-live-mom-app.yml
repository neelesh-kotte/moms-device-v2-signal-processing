name: Harden live MOM app

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/harden-live-mom-app.yml'
      - '.github/scripts/harden_live_mom.py'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Check out live GitHub Pages branch
        uses: actions/checkout@v4
        with:
          ref: project-portfolio-site
          fetch-depth: 0

      - name: Fetch hardening script from main
        run: git show origin/main:.github/scripts/harden_live_mom.py > /tmp/harden_live_mom.py

      - name: Patch live application
        run: python /tmp/harden_live_mom.py

      - name: Verify JavaScript syntax
        run: |
          node --check docs/assets/app.js
          node --check docs/assets/cloud-service.js
          node --check docs/assets/device-provisioning.js

      - name: Commit live hardening
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/app.js docs/index.html
          git commit -m "Harden MOM device and recording UX [skip ci]"
          git push origin HEAD:project-portfolio-site
