<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07110f"><title>MOM SenseLoop</title><style>body{margin:0;background:#07110f;color:#f4faf7;font-family:Inter,system-ui,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}p{color:#a9beb5}</style></head><body><main><div><h1>MOM SenseLoop</h1><p>Loading the current public and private experience…</p></div></main><script>(async()=>{try{const stamp=Date.now();const files=['bundle-1.txt','bundle-2.txt','bundle-3.txt','bundle-4.txt','bundle-5.txt','bundle-fix.txt','bundle-6.txt','bundle-7.txt','bundle-8.txt','bundle-9.txt'].map(f=>`${f}?cb=${stamp}`);const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`${f}: ${r.status}`);return r.text()})));const html=parts.join('');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<main><div><h1>MOM SenseLoop</h1><p>The site bundle could not load. Refresh the page to try again.</p></div></main>';console.error(e)}})()</script></body></html>
