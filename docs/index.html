<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06100d"><title>MOM SenseLoop</title><style>body{margin:0;background:#06100d;color:#f4faf7;font-family:Inter,system-ui,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}p{color:#83978f}</style></head><body><main><div><h1>MOM SenseLoop</h1><p>Loading the SenseLoop experience…</p></div></main><script>(async()=>{try{const stamp=Date.now();const files=["senseloop-final-01.txt", "senseloop-final-02.txt", "senseloop-final-03.txt", "senseloop-final-04.txt", "senseloop-final-05.txt", "senseloop-final-06.txt", "senseloop-final-07.txt", "senseloop-final-08.txt", "senseloop-final-09.txt", "senseloop-final-10.txt", "senseloop-final-11.txt"];const parts=await Promise.all(files.map(f=>fetch(`${f}?cb=${stamp}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`${f}: ${r.status}`);return r.text()})));const binary=atob(parts.join(''));const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));if(!('DecompressionStream' in window))throw new Error('This browser does not support the required decompression API. Please use a current version of Chrome, Safari, Edge, or Firefox.');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<main><div><h1>MOM SenseLoop</h1><p>The application could not load. Refresh the page or use a current browser.</p></div></main>';console.error(e)}})()</script></body></html>
